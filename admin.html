
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YOUSUF ALI Gaming — Admin</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 18px;
      background: #0b1020;
      color: #eef2ff;
      font-family: Arial, sans-serif;
    }
    .wrap { max-width: 760px; margin: auto; }
    h1 { color: #00d4ff; font-size: 25px; }
    .panel, .order {
      background: #151d32;
      border: 1px solid #293653;
      border-radius: 14px;
      padding: 16px;
      margin: 14px 0;
      overflow-wrap: anywhere;
    }
    input, select, button {
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      border-radius: 8px;
      border: 1px solid #394967;
      font-size: 15px;
    }
    input, select {
      background: #0b1020;
      color: white;
    }
    button {
      background: #00c9ef;
      color: #07111d;
      border: 0;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .55; }
    .secondary { background: #293653; color: white; }
    .status { color: #a5f3fc; overflow-wrap: anywhere; }
    .order p { margin: 9px 0; }
    .hidden { display: none; }
    small { color: #b9c6df; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>YOUSUF ALI Gaming</h1>
  <p>Admin Order Dashboard</p>

  <section id="login" class="panel">
    <h2>Admin Login</h2>
    <form id="loginForm">
      <input id="email" type="email"
        placeholder="Admin email" autocomplete="username" required>
      <input id="password" type="password"
        placeholder="Password" autocomplete="current-password" required>
      <button id="loginButton" type="submit">Login</button>
    </form>
    <p id="message" class="status" aria-live="polite"></p>
  </section>

  <section id="dashboard" class="hidden">
    <div class="panel">
      <h2>Orders</h2>
      <p id="orderMessage" class="status" aria-live="polite">
        Loading orders...
      </p>
      <button id="refresh" type="button" class="secondary">
        Refresh Orders
      </button>
      <button id="logout" type="button" class="secondary">
        Logout
      </button>
    </div>
    <div id="orders"></div>
  </section>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script>
"use strict";

// Firebase project configuration
const firebaseConfig = {
  apiKey: "AIzaSyDyRX9oCF2D0vGUkUcrxpv8o2rhSSVD3p8",
  authDomain: "yousuf-ali-gaming.firebaseapp.com",
  projectId: "yousuf-ali-gaming",
  storageBucket: "yousuf-ali-gaming.firebasestorage.app",
  messagingSenderId: "736038389268",
  appId: "1:736038389268:web:b717a07cb43076bd928901",
  measurementId: "G-KR3L6WSZ3X"
};

// Only this Firebase Auth UID is allowed in the dashboard.
const ADMIN_UID = "gIsJxXOyGKhUhf6ontux2zJnF9N2";

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

const loginBox = document.getElementById("login");
const dashboard = document.getElementById("dashboard");
const message = document.getElementById("message");
const orderMessage = document.getElementById("orderMessage");
const ordersBox = document.getElementById("orders");
const loginButton = document.getElementById("loginButton");

let loadingOrders = false;

document.getElementById("loginForm").addEventListener(
  "submit", async function(event) {
    event.preventDefault();
    loginButton.disabled = true;
    message.textContent = "Signing in...";

    try {
      const result = await auth.signInWithEmailAndPassword(
        document.getElementById("email").value.trim(),
        document.getElementById("password").value
      );

      if (result.user.uid !== ADMIN_UID) {
        await auth.signOut();
        message.textContent = "Access denied: not the admin.";
      } else {
        message.textContent = "Login successful.";
      }
    } catch (error) {
      console.error("Login error:", error);
      message.textContent =
        "Login failed. Check your email, password and connection.";
    } finally {
      loginButton.disabled = false;
    }
  }
);

auth.onAuthStateChanged(async function(user) {
  if (user && user.uid === ADMIN_UID) {
    loginBox.classList.add("hidden");
    dashboard.classList.remove("hidden");
    await loadOrders();
  } else {
    loginBox.classList.remove("hidden");
    dashboard.classList.add("hidden");
    ordersBox.replaceChildren();
    orderMessage.textContent = "";
  }
});

async function loadOrders() {
  if (loadingOrders) return;
  loadingOrders = true;
  ordersBox.replaceChildren();
  orderMessage.textContent = "Loading orders...";

  try {
    if (!auth.currentUser || auth.currentUser.uid !== ADMIN_UID) {
      orderMessage.textContent = "Admin authorization required.";
      return;
    }

    const snapshot = await db.collection("orders")
      .orderBy("createdAt", "desc").get();

    if (snapshot.empty) {
      orderMessage.textContent = "No orders found yet.";
      return;
    }

    orderMessage.textContent = snapshot.size + " order(s)";

    snapshot.forEach(function(doc) {
      const data = doc.data();
      const card = document.createElement("article");
      card.className = "order";

      function addText(label, value) {
        const p = document.createElement("p");
        p.textContent = label + ": " +
          (value == null ? "Not provided" : String(value));
        card.appendChild(p);
      }

      addText("Order ID", doc.id);
      addText("Player UID", data.uid);
      addText("Package", data.package);
      addText("Server", data.server);
      addText("Contact", data.contact);
      addText("Total", data.total);
      addText("Payment Method", data.paymentMethod);
      addText("TrxID", data.transactionId);
      addText("Status", data.status || "Pending");

      const select = document.createElement("select");
      select.setAttribute("aria-label", "Order status");

      ["Pending", "Processing", "Completed"].forEach(
        function(status) {
          const option = document.createElement("option");
          option.value = status;
          option.textContent = status;
          if ((data.status || "Pending") === status) {
            option.selected = true;
          }
          select.appendChild(option);
        }
      );

      const save = document.createElement("button");
      save.type = "button";
      save.textContent = "Update Status";

      save.addEventListener("click", async function() {
        if (!auth.currentUser ||
            auth.currentUser.uid !== ADMIN_UID) {
          orderMessage.textContent = "Admin authorization required.";
          return;
        }

        const newStatus = select.value;
        save.disabled = true;
        orderMessage.textContent = "Updating order...";

        try {
          // Update the private order.
          await db.collection("orders").doc(doc.id).update({
            status: newStatus
          });

          const publicRef =
            db.collection("publicTopUps").doc(doc.id);

          if (newStatus === "Completed") {
            // Only non-identifying fields are published.
            await publicRef.set({
              package: String(data.package || "Top-Up"),
              total: Number(data.total) || 0,
              status: "success",
              verified: true,
              completedAt:
                firebase.firestore.FieldValue.serverTimestamp()
            });
          } else {
            // Remove it from public activity if not completed.
            await publicRef.delete();
          }

          orderMessage.textContent =
            "Status updated and public activity synced.";
          await loadOrders();

        } catch (error) {
          console.error("Status update error:", error);
          orderMessage.textContent =
            "Status/public sync failed. Check Firestore Rules.";
          save.disabled = false;
        }
      });

      card.appendChild(select);
      card.appendChild(save);
      ordersBox.appendChild(card);
    });

  } catch (error) {
    console.error("Load orders error:", error);
    orderMessage.textContent =
      "Could not load orders. Check Firestore Rules and connection.";
  } finally {
    loadingOrders = false;
  }
}

document.getElementById("refresh").addEventListener(
  "click", loadOrders
);

document.getElementById("logout").addEventListener(
  "click", async function() {
    await auth.signOut();
  }
);
</script>
</body>
</html>
