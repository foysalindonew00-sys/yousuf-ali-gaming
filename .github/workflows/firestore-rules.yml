name: Firestore Rules Security Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [security-audit-2026-10-25]

permissions:
  contents: read

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install test dependencies
        run: npm install --prefix tests
      - name: Test Firestore rules in emulator
        run: ./tests/node_modules/.bin/firebase emulators:exec --only firestore --project demo-yousuf-ali-gaming "npm --prefix tests run test:rules"

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies
        run: npm install --prefix tests
      - name: Audit test dependencies (high and critical)
        run: npm audit --prefix tests --audit-level=high
